# 单个项目配置示例；复制新增项目时必须修改 id、name 和 repository。
# 项目唯一 ID；用于 URL、数据库主键和公开路径，不得重复。
id: "example"
# 下载页和管理面板展示的项目中文名称。
name: "示例项目"
# GitHub 仓库，必须使用 owner/repository 格式，不允许 URL。
repository: "owner/repository"
# 项目专属页描述；留空时不展示描述组件。
description: ""
# 项目官网地址；仅支持 http/https，留空时不展示“转到官网”按钮。
homepage_url: ""
# 项目图标相对当前项目配置文件所在目录；留空表示使用内置占位图标。
icon_path: ""
# 首页搜索与筛选标签；分组和值可以不在 filters.yaml 中声明，未声明标签仍可搜索。
tags: {}
# 是否启用该项目；禁用后不会参与扫描和公共展示。
enabled: false
# 每个下载节点应保留的实际镜像版本数量，默认值为 3；只有经过资产筛选后至少有一个有效镜像资产的版本才占用名额。
retain_versions: 3
# 是否允许 GitHub prerelease 版本进入候选版本。
include_prerelease: false
# 倍率仅扣减请求额度，不放大实际流量统计或每日流量限额。
download_multiplier: 1
# 下载页初始选择方式；selectors 表示条件选择，file 表示文件选择。
default_selection_mode: selectors
# 资产入选规则，只有通过 asset_include 且未命中 asset_exclude 的资产才会进入镜像。
# 每条规则可以写成旧格式字符串，例如 "*.zip"；旧格式等同于 type: glob、required: false。
# 推荐写成对象，字段说明：
# - pattern：匹配文件名的字符串，不能为空。
# - type：glob 或 regex；glob 支持 "*.zip"，regex 支持 Go 正则和 (?i) 大小写选项。
# - required：true 表示必选规则；false 表示可选规则。
# include 语义：所有 required=true 必须命中；如果存在 required=false，则还要至少命中一条可选规则。
# 没有 include 规则时，默认允许所有资产进入下一步。
asset_include:
  -
    # pattern 匹配资产文件名；type=regex 时使用 Go 正则。
    pattern: "\\.zip$"
    # type 可选 glob 或 regex；旧字符串写法按 glob 处理。
    type: regex
    # required=false 表示可选入选规则；required=true 表示必须命中。
    required: false
# 排除规则优先于包含规则。
# exclude 语义：任意 required=false 命中就排除；required=true 用于组合排除，只有所有必选排除规则都命中才排除。
asset_exclude:
  -
    # pattern 匹配需要排除的资产文件名。
    pattern: "(?i)(debug|source|unsigned)"
    # type 可选 glob 或 regex；regex 支持 (?i) 大小写不敏感。
    type: regex
    # required=false 命中即排除；required=true 参与组合排除。
    required: false
# 可选：分类/指派规则。过滤仍由 asset_include 和 asset_exclude 决定；
# 这里用于为文件补充 system、architecture、variant 等展示和选择信息。
asset_pipeline:
  # 下载页的条件选择器独立于分类方式，可按维度分别开启。
  selectors:
    # 是否显示架构选择器；适用于 regex、rules 和 script 分类。
    architecture_enabled: true
    # 是否显示系统选择器；适用于 regex、rules 和 script 分类。
    system_enabled: true
  # classify.mode 为每个项目选择一种资产分类方式。
  # - regex：只使用 regex 子节点里的提取配置，rules 和 script 不参与分类。
  # - rules：只使用下方 rules/script，旧正则配置即使存在也不会执行。
  # - 留空：兼容旧配置，会先跑旧正则再跑 rules/script；新项目建议显式写 regex 或 rules。
  classify:
    # 分类模式；新项目建议明确选择 regex 或 rules。
    mode: rules
    # regex 模式专用配置；mode=rules 时不会执行。
    regex:
      # 启用后 architecture_regex 从已入选资产文件名提取展示架构。
      architecture_match_enabled: false
      # 仅在 architecture_match_enabled=true 时编译和使用。
      architecture_regex: "(?i)(amd64|arm64|x86_64)"
      # 启用后 system_regex 从文件名提取并规范化为 win/linux/darwin/harmony。
      system_match_enabled: false
      # 仅在 system_match_enabled=true 时编译和使用。
      system_regex: "(?i)(windows|win|linux|darwin|macos|osx|harmonyos|openharmony|ohos)"
    # rules 按顺序应用；后命中的赋值可以覆盖前面规则的赋值。
    rules:
      -
        # match 定义要匹配的资产文件名，exact、glob、regex 三选一。
        match:
          # regex 使用 Go 正则匹配资产文件名。
          regex: "^7z\\d+\\.exe$"
        # assign 定义命中后写入资产展示和选择字段的值。
        assign:
          # system 可写 win、linux、darwin、harmony 或 None。
          system: "win"
          # architecture 可写 amd64、arm64、arm、x86、x86_64、arm64-v8a、armeabi-v7a、all 或 None。
          architecture: "amd64"
          # variant 用于区分 binary、src、extra 等资产变体。
          variant: "binary"
    # script 可选；用于通过 Starlark 脚本执行高级分类。
    script:
      # path 为相对当前项目配置文件的脚本路径。
      path: ""
      # inline 为内联脚本；通常建议使用 path 便于维护。
      inline: ""
