# 镜像服务主节点配置示例
# 本文件使用 UTF-8 编码。密码、会话密钥和签名密钥不得直接填写在本文件中。
# 主节点监听入口配置。
server:
  # 公共页面和公开 API 监听地址。
  public_listen: ":8080"
  # 管理面板默认只监听本机；需要远程管理时可改为明确的管理网络地址。
  management_listen: "127.0.0.1:9080"
  # 下载节点 mTLS 控制通道监听地址。
  control_listen: ":9443"
  # 首次领证登记入口，独立于正式 mTLS 控制通道。
  enrollment_listen: ":9444"
  # 首页项目瀑布流每一批加载的行数；实际卡片数为当前列数乘以该值。
  catalog_batch_rows: 4
  # 本批剩余多少行尚未滚到时预加载下一批；0 表示进入最后一行时加载。
  catalog_prefetch_remaining_rows: 1

# 主节点 SQLite 数据库配置。
database:
  # 主节点数据库文件路径；目录不存在时会自动创建。
  path: "data/master.db"
  # SQLite 写锁等待时间；并发写入繁忙时最多等待该时长。
  busy_timeout: "5s"
  # 数据库健康检查间隔。
  health_check_interval: "10s"
  # 单次数据库健康检查的超时时间。
  health_check_timeout: "3s"
  # 连续检查失败达到该次数后主节点退出，由进程守护器重启。
  health_failure_threshold: 3
  # 是否启用 SQLite WAL 日志模式；推荐保持 true 以减少读写互相阻塞。
  wal: true
  # SQLite 自动 checkpoint 的 WAL 页数阈值。
  wal_autocheckpoint_pages: 1000
  # SQLite WAL 文件在 checkpoint 后建议保留的最大尺寸。
  wal_journal_size_limit: "256 MiB"
  # 主节点启动和后台维护时，WAL 文件超过该尺寸会尝试 TRUNCATE checkpoint。
  wal_truncate_threshold: "256 MiB"
  # 主节点运行期后台 WAL checkpoint 检查间隔。
  wal_checkpoint_interval: "5m"

# 主节点日志配置。
logging:
  # 控制台日志等级，可选 debug、info、warn、error。
  console_level: "info"
  # 文件日志等级，可选 debug、info、warn、error。
  file_level: "info"
  # 主节点日志目录；按日期写入 master-YYYY-MM-DD.log。PoW 遥测写入同级 logs/pow/。
  directory: "logs/master"
  # 日志保留天数；早于该天数的主节点 .log 和 .log.gz 会在轮转时清理。
  retention_days: 365
  # 单个日志文件上限（MiB）；达到后按序号封存并在后台压缩，默认 1 GiB。
  max_file_size_mb: 1024

# 请求 ID 透传配置。
request_id:
  # 每个响应写入的新请求 ID 响应头名称。
  response_header: "X-Request-ID"
  # 读取上游父请求 ID 的请求头名称；非法或过长的值会被忽略。
  parent_header: "X-Request-ID"

# 反向代理信任配置。
proxy:
  # 仅直连来源位于以下网段时才信任代理转发头。
  trusted_cidrs: []

# 统计时区配置。
stats:
  # 日统计、每日流量限额和日志轮转使用的 IANA 时区名称。
  timezone: "Asia/Shanghai"

# 明细事件归档配置。
archive:
  # 是否把授权、授权状态和流量明细追加写入按天分段 JSONL 文件。
  enabled: true
  # 归档根目录；程序会写入 traffic/、authorization/ 和 authorization_status/ 子目录。
  root: "logs"

# GitHub Release 扫描配置。
scan:
  # 单个启用项目的自动扫描间隔；项目配置变化后会尽快扫描。
  interval: "15m"
  # 仅填写环境变量名称，不得填写 GitHub 凭据内容；生产环境建议注入只读 Fine-grained PAT。
  github_token_env: "MIRROR_GITHUB_TOKEN"
  # GitHub Release API 单次请求超时。
  github_timeout: "2m"
  # 主节点扫描 GitHub Release API 使用的 SOCKS5 代理；只影响入库扫描，不影响下载节点同步资产。
  socks5:
    # 是否启用 GitHub Release 扫描出站 SOCKS5 代理。
    enabled: false
    # 可填 socks5://127.0.0.1:1080 或 socks5h://127.0.0.1:1080；socks5h 由代理端解析域名。
    url: "socks5h://127.0.0.1:1080"
    # SOCKS5 用户名；无认证时留空。
    username: ""
    # SOCKS5 密码；无认证时留空。
    password: ""

# 普通网页与公开 API PoW 按可信资产大小共用的基础难度分档。
# 匹配不超过资产大小的最后一个 min_size；可继续增加严格递增的分档。
pow_size_tiers:
  # 小于 5 MiB 的资产。
  -
    # 该档生效的最小资产大小。
    min_size: "0 B"
    # SHA-256 前导零位数。
    difficulty: 20
  # 5 MiB 到 50 MiB 的资产。
  -
    # 该档生效的最小资产大小。
    min_size: "5 MiB"
    # SHA-256 前导零位数。
    difficulty: 22
  # 50 MiB 到 150 MiB 的资产。
  -
    # 该档生效的最小资产大小。
    min_size: "50 MiB"
    # SHA-256 前导零位数。
    difficulty: 23
  # 150 MiB 到 300 MiB 的资产。
  -
    # 该档生效的最小资产大小。
    min_size: "150 MiB"
    # SHA-256 前导零位数。
    difficulty: 24
  # 300 MiB 到 500 MiB 的资产。
  -
    # 该档生效的最小资产大小。
    min_size: "300 MiB"
    # SHA-256 前导零位数。
    difficulty: 25
  # 500 MiB 及以上的资产。
  -
    # 该档生效的最小资产大小。
    min_size: "500 MiB"
    # SHA-256 前导零位数。
    difficulty: 26

# 正常网页与公开 API V2 的 repeated-squaring 迭代数分档。
vdf_size_tiers:
  -
    # 该档生效的最小资产大小。
    min_size: "0 B"
    # 该档的基础重复平方迭代数。
    iterations: 12000
  -
    # 该档生效的最小资产大小。
    min_size: "5 MiB"
    # 该档的基础重复平方迭代数。
    iterations: 48000
  -
    # 该档生效的最小资产大小。
    min_size: "50 MiB"
    # 该档的基础重复平方迭代数。
    iterations: 96000
  -
    # 该档生效的最小资产大小。
    min_size: "150 MiB"
    # 该档的基础重复平方迭代数。
    iterations: 192000
  -
    # 该档生效的最小资产大小。
    min_size: "300 MiB"
    # 该档的基础重复平方迭代数。
    iterations: 384000
  -
    # 该档生效的最小资产大小。
    min_size: "500 MiB"
    # 该档的基础重复平方迭代数。
    iterations: 768000

# RSA repeated-squaring 挑战配置。
vdf:
  # V2 挑战从创建到过期的有效时间。
  challenge_ttl: "2m"
  # 后台生成并原子切换 RSA 模数的间隔。
  key_rotation_interval: "24h"
  # 可疑来源的迭代数倍率。
  elevated_multiplier: 2
  # 严重来源的迭代数倍率。
  severe_multiplier: 4
  # 单个挑战允许的最大迭代数。
  max_iterations: 10000000
  # 服务端同时计算预期答案的最大数量。
  max_parallel_creations: 4

# 公开 API PoW 挑战配置。
api_pow:
  # 公开 API PoW 算法；当前实现只支持 sha256。
  algorithm: "sha256"
  # 公开 API 挑战从创建到过期的有效时间。
  challenge_ttl: "2m"
  # 是否保留 V1 SHA-256 挑战和授权入口。
  v1_enabled: true

# 公共下载链路自适应防御与惩罚 PoW。
abuse_control:
  # 策略模式：off 完全关闭新增策略，observe 只记录不拦截，enforce 正式启用。
  mode: "enforce"
  # 自适应挑战参数。
  challenge:
    # 统计突发请求时采用的时间窗口。
    burst_window: "1m"
    # 统计滚动请求时采用的时间窗口。
    rolling_window: "10m"
    # 答案错误时按此权重计数。
    invalid_solution_weight: 4
    # 可疑等级在基础难度上增加的位数。
    elevated_bits: 2
    # 严重等级在基础难度上增加的位数。
    severe_bits: 4
    # 普通自适应挑战允许的最高难度位数。
    max_bits: 28
    # 精确来源的阈值。
    exact:
      # 单 IP 可疑等级的 1 分钟阈值。
      elevated_burst: 6
      # 单 IP 可疑等级的 10 分钟阈值。
      elevated_rolling: 15
      # 单 IP 严重等级的 1 分钟阈值。
      severe_burst: 12
      # 单 IP 严重等级的 10 分钟阈值。
      severe_rolling: 25
      # 单 IP 拒绝等级的 1 分钟阈值。
      reject_burst: 20
      # 单 IP 拒绝等级的 10 分钟阈值。
      reject_rolling: 30
    # 网段来源的阈值。
    network:
      # 网段可疑等级的 1 分钟阈值。
      elevated_burst: 60
      # 网段可疑等级的 10 分钟阈值。
      elevated_rolling: 150
      # 网段严重等级的 1 分钟阈值。
      severe_burst: 120
      # 网段严重等级的 10 分钟阈值。
      severe_rolling: 250
      # 网段拒绝等级的 1 分钟阈值。
      reject_burst: 200
      # 网段拒绝等级的 10 分钟阈值。
      reject_rolling: 300
  # 封禁缓存、刷新和升级参数。
  blocked:
    # 封禁后增量计数的后台刷新间隔。
    flush_interval: "30s"
    # 单个封禁累计到该次数后立即刷新一次数据库。
    flush_batch: 100
    # 未命中封禁记录时的负缓存有效期。
    cache_negative_ttl: "30s"
    # 期限升级参数。
    escalation:
      # 封禁后总尝试达到该值时升级到第一级。
      level_1_attempts: 10
      # 第一级升级后的最短到期时长。
      level_1_duration: "720h"
      # 封禁后总尝试达到该值时升级到第二级。
      level_2_attempts: 50
      # 第二级升级后的最短到期时长。
      level_2_duration: "2160h"
      # 封禁后总尝试达到该值时升级到第三级。
      level_3_attempts: 200
      # 第三级升级后的最短到期时长。
      level_3_duration: "8760h"
  # 128 位惩罚 PoW 参数。
  punishment:
    # 是否启用 128 位惩罚 PoW。
    enabled: true
    # 惩罚页的固定 PoW 难度。
    difficulty: 128
    # 自动封禁后总尝试达到该值时进入惩罚状态。
    total_attempts: 30
    # 自动封禁后 1 分钟内尝试达到该值时进入惩罚状态。
    burst_attempts: 20
    # 自动封禁后 10 分钟内尝试达到该值时进入惩罚状态。
    rolling_attempts: 30
    # 惩罚页最多启动的 Worker 数量。
    worker_limit: 32

# 下载令牌签发与验证密钥配置。
download_token:
  # 令牌签发后必须首次连接下载节点的时间窗口。
  first_connection_timeout: "20s"
  # 活跃授权在没有新请求、且传输中没有成功写出字节时的空闲超时。
  idle_timeout: "120s"
  # 从签发开始计算的最长授权时长，到期后下载节点会断开传输。
  max_duration: "30m"
  # 主节点保存 Ed25519 私钥用于签发下载令牌，私钥不得分发给下载节点。
  signing_private_key_file: "secrets/download-token-ed25519.key"
  # 下载节点只需要同一对密钥的公钥来验证令牌。
  verify_public_key_file: "secrets/download-token-ed25519.pub"

# 下载节点控制面配置。
node:
  # 主节点判定下载节点心跳延迟的软超时时间。
  heartbeat_timeout: "90s"
  # 心跳超过 heartbeat_timeout 后继续等待的离线宽限时间，超过两者之和才标记离线。
  heartbeat_offline_grace: "5m"
  # 主节点下发给下载节点的建议心跳间隔，必须小于 heartbeat_timeout。
  heartbeat_interval: "15s"
  # 是否启用主节点对下载节点公网 HTTP 入口的防伪探测。
  public_probe_enabled: true
  # 主节点对每个在线下载节点发起公网探测的最小间隔。
  public_probe_interval: "60s"
  # 主节点访问下载节点公网探测路径的单次超时时间。
  public_probe_timeout: "10s"
  # 下载节点公网探测挑战从下发到过期的有效时间，必须大于 public_probe_timeout。
  public_probe_ttl: "30s"
  # DNS、TCP、TLS 或超时等网络类公网探测失败达到该次数后暂停公开下载路由，不标记控制面离线。
  public_probe_network_failures: 5
  # 下载节点首次登记请求的有效时间。
  enrollment_timeout: "10m"
  # 控制台生成的一次性配对码有效时间。
  pairing_code_ttl: "5m"
  # 下载节点登记、控制连接和证书签发使用的 TLS 材料。
  tls:
    # 主节点控制/登记服务端证书对应的 CA 文件，会下发给下载节点信任。
    ca_file: "secrets/master-ca.pem"
    # 主节点控制/登记服务端证书对应的 CA 私钥，只用于本机生成服务端证书。
    ca_key_file: "secrets/master-ca.key"
    # 主节点控制/登记入口使用的服务端证书。
    cert_file: "secrets/master-control.crt"
    # 主节点控制/登记入口服务端私钥，不得分发给下载节点。
    key_file: "secrets/master-control.key"
    # 控制通道用于校验下载节点客户端证书的 CA 文件。
    client_ca_file: "secrets/node-signing-ca.pem"
    # 管理面板批准节点登记时使用的节点签发 CA 证书。
    signing_ca_cert_file: "secrets/node-signing-ca.pem"
    # 管理面板批准节点登记时使用的节点签发 CA 私钥。
    signing_ca_key_file: "secrets/node-signing-ca.key"

# 管理面板配置。
admin:
  # 管理面板 Web 登录、会话和防爆破配置。
  web:
    # 是否由后端管理监听直接启用 HTTPS；前置 nginx 已终止 HTTPS 时可设为 false。
    https_enabled: true
    # 管理面板用户文件路径；不存在时会自动创建初始用户。
    users_file: "secrets/admin-users.yaml"
    # 初始用户密码来源环境变量名；存在且有值时创建 admin 用户，否则生成随机账号密码并只输出到控制台。
    bootstrap_password_env: "MIRROR_ADMIN_WEB_PASSWORD"
    # 管理面板会话签名密钥文件；不存在时自动生成随机密钥。
    session_secret_file: "secrets/admin-web-session.key"
    # 管理面板登录会话有效时间。
    session_ttl: "12h"
    # 统计同一来源登录失败次数的时间窗口。
    login_failure_window: "24h"
    # 同一来源在窗口内允许的最大密码错误次数，达到后写入登录封禁。
    login_failure_limit: 3
    # 管理面板登录封禁持续时间。
    login_ban_duration: "168h"
  # 管理面板 HTTPS 服务端证书配置。
  tls:
    # 管理面板 HTTPS 服务端证书；https_enabled=false 时不会被后端加载。
    cert_file: "secrets/admin-web.crt"
    # 管理面板 HTTPS 服务端私钥；https_enabled=false 时不会被后端加载。
    key_file: "secrets/admin-web.key"
