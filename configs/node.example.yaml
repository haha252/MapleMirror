# 镜像服务下载节点配置示例
# 本文件使用 UTF-8 编码。节点身份、证书、私钥、登记临时状态和下载令牌公钥
# 会存入 storage.state_db；下方文件路径仅用于旧版本导入或非交互登记兜底。
# 下载节点本地身份展示配置。
node:
  # 下载节点公开展示名称；首次交互登记会写回该字段。
  name: "示例下载节点"

# 下载节点 HTTP 文件服务配置。
server:
  # 下载节点 HTTP 文件服务和健康检查监听地址。
  listen: ":8081"
  # 浏览器最终下载文件时访问的公网基地址，主节点会基于它返回完整下载链接。
  public_download_base_url: "https://node1.example.com"

# 主节点连接地址配置。
master:
  # 下载节点主动连接主节点 mTLS 控制面。
  control_address: "https://127.0.0.1:9443"
  # 下载节点首次登记和重新登记时访问的主节点 HTTPS 登记入口。
  enrollment_address: "https://127.0.0.1:9444"

# 下载节点本地存储配置。
storage:
  # 已校验资产的本地保存目录。
  directory: "data/assets"
  # 同步下载临时目录；启动时会清理未完成的临时文件。
  temp_directory: "data/tmp"
  # 节点状态库将持久化节点身份材料、登记临时状态、同步状态和未被主节点确认的流量事件。
  state_db: "data/node-state.db"

# 下载节点出口带宽预算配置。
bandwidth:
  # 服务器总出口目标带宽，也是 mirror 节点自身上行硬上限；支持 MiB/s、MB/s、Mbps。
  target: "100 MiB/s"
  # 其它服务占用较高时，mirror 上行仍保留的最低带宽；"0" 表示不保底。
  minimum: "5 MiB/s"

# 下载节点同步执行配置。
sync:
  # 同步任务并发上限；节点控制客户端按该值限制同时执行的同步任务数。
  max_workers: 2
  # 本节点最多自动承接的镜像项目数；0 表示不限制，保持全量镜像。
  max_mirror_projects: 0
  # 是否强制只从其他下载节点复制资产；启用后不会尝试 GitHub 源站，缺少可用节点副本时等待主节点重试。
  force_peer_download: false
  # 单个同步下载限速；支持 MiB/s、MB/s、Mbps，"0" 表示不限制。
  bandwidth_limit: "0"
  # peer fallback 全局任务并发数；源站故障时可调高以加快从其他节点复制。
  peer_fallback_max_concurrent: 3
  # peer fallback 单文件分片下载并发数。
  peer_fallback_workers: 8
  # peer fallback 文件达到该大小才启用分片；支持 B、KiB、MiB、GiB，"0" 表示所有 peer 文件都分片。
  peer_fallback_min_size: "32 MiB"

# 下载令牌验证配置。
download_token:
  # 旧版本下载令牌 Ed25519 公钥文件；启动时会导入 state_db，下载节点不保存签发私钥。
  verify_public_key_file: "data/download-token-ed25519.pub"

# 反向代理信任配置。
proxy:
  # 下载节点若位于反向代理后，仅信任这些直连代理 CIDR 提供的转发头。
  trusted_cidrs: []

# 下载节点日志配置。
logging:
  # 控制台日志等级，可选 debug、info、warn、error。
  console_level: "info"
  # 文件日志等级，可选 debug、info、warn、error。
  file_level: "info"
  # 日志文件目录；下载节点按日期写入 node-YYYY-MM-DD.log，历史日志会自动压缩为 .log.gz。
  directory: "logs/node"
  # 日志保留天数；早于该天数的下载节点 .log 和 .log.gz 会在轮转时清理。
  retention_days: 30

# 首次登记和重新登记配置。
pairing:
  # 旧版本登记临时凭据文件；新登记状态写入 state_db，重新配置时会清理。
  credential_file: "data/node-credential.json"
  # 非交互登记可从该文件读取一次性配对码；交互式登记会写入 state_db。
  code_file: "data/pairing-code"

# 下载节点 TLS 身份材料配置。
tls:
  # 旧版本主节点 CA 文件；启动时会导入 state_db。
  ca_file: "data/master-ca.pem"
  # 旧版本下载节点客户端证书；启动时会导入 state_db。
  cert_file: "data/node.crt"
  # 旧版本下载节点客户端私钥；启动时会导入 state_db，私钥不得记录到日志。
  key_file: "data/node.key"
  # 校验主节点 TLS 证书时使用的服务端名称。
  server_name: "127.0.0.1"
