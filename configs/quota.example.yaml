# 主节点额度配置示例
# 请求额度按地址和网段同时检查；每日流量一律按节点真实发送字节统计。
request_buckets:
  ipv4_32:
    capacity: 120
    full_refill: "48h"
  ipv4_24:
    capacity: 600
    full_refill: "48h"
  ipv6_128:
    capacity: 120
    full_refill: "48h"
  ipv6_64:
    capacity: 600
    full_refill: "48h"

daily_traffic:
  ipv4_32: "3 GiB"
  ipv4_24: "20 GiB"
  ipv6_128: "3 GiB"
  ipv6_64: "20 GiB"

# 单个下载授权最多允许发送的字节数 = 资产大小 * 此倍数，用于 Range 重试和断点续传。
authorization_max_bytes_multiplier: 2

# 单个下载授权允许同时存在的 Range 请求数。
range_concurrency_limit: 32

# 兼容旧格式的静态黑名单；推荐新配置使用 blocklist.static。
blacklist: []

# 黑名单命中后会拒绝挑战创建和下载授权签发；exemptions 优先于黑名单。
blocklist:
  static: []
  # 本站因请求令牌或每日流量额度耗尽写入的自动封禁时长，默认 7 天。
  auto_ban_duration: "168h"
  feeds:
    # - url: "https://bcr.pbh-btn.ghorg.ghostchu-services.top/combine/all.txt"
    #   refresh_interval: "1h"
    #   timeout: "10s"

exemptions:
  - 127.0.0.1
  - ::1
