<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<script>
(function () {
  var root = document.documentElement;
  var mode = localStorage.getItem("mirror-mode");
  var accent = localStorage.getItem("mirror-accent") || "maple";
  if (mode !== "light" && mode !== "dark") {
    mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  root.setAttribute("data-theme", mode);
  root.setAttribute("data-accent", accent);
})();
</script>
<link rel="icon" type="image/webp" href="/static/public/logo.webp">
<link rel="stylesheet" href="/static/public/base.css">
{{range .Styles}}<link rel="stylesheet" href="{{.}}">
{{end}}
</head>
<body class="{{.BodyClass}}">
<div id="page-loading-bar" class="page-loading-bar" aria-hidden="true"></div>
<header class="site-header">
  <div class="site-header__left">
    <div class="site-brand" aria-label="枫源镜像">
      <img src="/static/public/logo.webp" alt="">
      <span>枫源镜像</span>
    </div>
    <nav class="site-nav" aria-label="主导航">
      <a href="/" aria-label="首页" title="首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9h13v-9M9 19v-5h6v5"/></svg><span>首页</span></a>
      <a href="/stats" aria-label="数据统计" title="数据统计"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 19V5m0 14h16M8 16V9m4 7V6m4 10v-4"/></svg><span>数据统计</span></a>
      <a href="/api-docs" aria-label="API 文档" title="API 文档"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span>API 文档</span></a>
      <a href="/about" aria-label="关于" title="关于"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 17v-6m0-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg><span>关于</span></a>
    </nav>
  </div>
  <div class="theme-tools">
    <button type="button" id="mode-toggle" class="icon-button" aria-label="切换明暗模式" title="切换明暗模式"></button>
    <button type="button" id="palette-toggle" class="icon-button" aria-label="选择主题色" title="选择主题色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18h1.5a2 2 0 0 0 1.4-3.4l-.3-.3a1.8 1.8 0 0 1 1.3-3.1H18a6 6 0 0 0 0-12h-6Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14" cy="7.5" r="1"/></svg></button>
    <div id="palette-menu" class="palette-menu" hidden></div>
  </div>
</header>
<main class="site-main">
  <div class="page-title-row">
    <h1>{{.Title}}</h1>
    {{if .Subtitle}}<p class="page-subtitle">{{.Subtitle}}</p>{{end}}
  </div>
  {{.Body}}
</main>
<footer class="site-footer">
  <div>Built with <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg> by Frostlynx | 联系我们：frostlynx@qq.com</div>
  <a href="https://beian.miit.gov.cn/" rel="noopener noreferrer" target="_blank">渝ICP备2024044523号-1</a>
</footer>
<script src="/static/public/theme.js" defer></script>
{{range .Scripts}}<script src="{{.}}" defer></script>
{{end}}
</body>
</html>
