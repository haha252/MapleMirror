<section class="download-pow-page punishment-pow-page">
  <div class="download-pow panel-card punishment-pow">
    <div class="download-pow__head punishment-pow__head">
      <p class="punishment-pow__eyebrow" data-i18n="punishment.eyebrow">人机验证</p>
      <h2 id="punishment-pow-title" data-i18n="punishment.title">你是人类吗？</h2>
      <p class="muted punishment-pow__lead" data-i18n="punishment.lead">你在干什么啊？？？</p>
    </div>
    <div id="punishment-pow-status" class="status status--strong muted" data-i18n="punishment.calculating">正在计算验证答案……</div>
    <div class="punishment-pow__body">
      <p><span data-i18n="punishment.appealPrefix">如果你认为这是误判，请发送邮件至 </span><a href="mailto:frostlynx@qq.com">frostlynx@qq.com</a><span data-i18n="punishment.appealSuffix">，附上本页截图、出现时间和请求编号，并简要说明出现此页面前进行的操作。请勿提供密码或下载令牌。</span></p>
      <dl class="punishment-pow__meta">
        <div><dt data-i18n="punishment.requestId">请求编号</dt><dd id="punishment-pow-request-id">{{.RequestID}}</dd></div>
        <div><dt data-i18n="punishment.serverTime">服务器时间</dt><dd id="punishment-pow-server-time">{{.ServerTime}}</dd></div>
        <div><dt data-i18n="punishment.source">您的 IP</dt><dd id="punishment-pow-source">{{.Source}}</dd></div>
        <div><dt data-i18n="punishment.email">申诉邮箱</dt><dd id="punishment-pow-email">{{.Email}}</dd></div>
      </dl>
    </div>
  </div>
  <script id="punishment-pow-data" type="application/json">{{.Payload}}</script>
</section>
