<section class="download-page">
  <div id="catalog-filter-backdrop" class="catalog-filter-backdrop" hidden></div>
  <div class="download-layout">
    <div class="catalog-left-rail">
      {{if .Notices}}<div class="page-notices catalog-page-notices">
        {{range .Notices}}<div class="page-notice page-notice--{{.Level}}" role="status" aria-live="polite">{{.Message}}</div>{{end}}
      </div>{{end}}
      <aside id="catalog-filters" class="catalog-filters" aria-label="项目筛选器">
        <div class="catalog-filters__mobile-head">
          <h2>筛选器</h2>
          <div class="catalog-filters__mobile-actions">
            <button id="catalog-filter-clear" type="button" disabled>
              <svg aria-hidden="true"><use href="{{staticURL "icons.svg#broom"}}"></use></svg>
              <span>取消全部</span>
            </button>
            <button id="catalog-filter-close" type="button" aria-label="关闭筛选器">
              <svg aria-hidden="true"><use href="{{staticURL "icons.svg#close"}}"></use></svg>
            </button>
          </div>
        </div>
        <div id="catalog-filter-groups" class="catalog-filter-groups">
          <p class="muted">正在加载筛选器...</p>
        </div>
      </aside>
    </div>
    <div class="catalog-mobile-toolbar">
      <label class="catalog-search" for="catalog-search-mobile">
        <svg aria-hidden="true"><use href="{{staticURL "icons.svg#search"}}"></use></svg>
        <input id="catalog-search-mobile" type="search" autocomplete="off"
          maxlength="100" placeholder="搜索项目、ID 或标签">
      </label>
      <button id="catalog-filter-button" class="catalog-filter-button" type="button"
        aria-controls="catalog-filters" aria-expanded="false">
        <svg aria-hidden="true"><use href="{{staticURL "icons.svg#filter"}}"></use></svg>
        <span>筛选器</span><span id="catalog-filter-count" class="catalog-filter-count" hidden></span>
      </button>
    </div>
    <section class="catalog-results" aria-live="polite"
      data-catalog-batch-rows="{{.CatalogBatchRows}}"
      data-catalog-prefetch-remaining-rows="{{.CatalogPrefetchRemainingRows}}">
      <div id="download-status" class="status muted">正在加载项目列表...</div>
      <div id="project-cards" class="project-grid" data-project-grid></div>
      <div id="project-load-more" class="catalog-load-more" hidden>
        <button type="button">加载更多项目</button>
        <span role="status" aria-live="polite"></span>
      </div>
      <section id="catalog-suggestions" class="catalog-suggestions" hidden>
        <h2><span id="catalog-suggestions-title">没有严格匹配的项，但你可能在找：</span></h2>
        <div id="suggested-project-cards" class="project-grid" data-project-grid></div>
        <div id="suggested-project-load-more" class="catalog-load-more" hidden>
          <button type="button">加载更多建议</button>
          <span role="status" aria-live="polite"></span>
        </div>
      </section>
    </section>
  </div>
  <template id="project-card-template">
    <section class="project-card panel-card">
      <div class="project-card__head">
        <div class="project-card__meta">
          <img class="project-card__icon" alt="">
          <div class="project-card__title">
            <h2><a class="project-link" href=""><span class="project-name"></span></a></h2>
            <div class="project-card__identity">
              <div class="project-card__source">
                <p class="muted version-badge"></p>
                <p class="muted project-repository"></p>
              </div>
              <div class="selection-mode" role="group" aria-label="文件选择方式">
                <button type="button" data-selection-mode="selectors" aria-pressed="true"
                  aria-label="条件选择" title="条件选择">
                  <svg aria-hidden="true"><use href="{{staticURL "icons.svg#selection-conditions"}}"></use></svg>
                </button>
                <button type="button" data-selection-mode="file" aria-pressed="false"
                  aria-label="文件选择" title="文件选择">
                  <svg aria-hidden="true"><use href="{{staticURL "icons.svg#selection-files"}}"></use></svg>
                </button>
              </div>
            </div>
            <p class="muted project-updated"></p>
            <div class="project-tags" aria-label="项目标签"></div>
          </div>
        </div>
      </div>
      <div class="project-card__body">
        <div class="field version-field"><label>版本</label><select class="version-select"></select></div>
        <div class="field system-field" hidden><label>系统</label><select class="system-select"></select></div>
        <div class="field architecture-field" hidden><label>架构</label><select class="architecture-select"></select></div>
        <div class="file-browser" data-folder-icon="{{staticURL "icons.svg#selection-files"}}" hidden>
          <section class="file-browser__level file-browser__level--versions">
            <p class="file-browser__title">版本文件夹</p>
            <div class="file-browser__versions" role="group" aria-label="版本"></div>
          </section>
          <section class="file-browser__level file-browser__level--files" hidden>
            <div class="file-browser__toolbar">
              <button class="file-browser__back" type="button">← 返回版本列表</button>
              <p class="file-browser__path"></p>
            </div>
            <div class="file-browser__files" role="group" aria-label="文件"></div>
          </section>
        </div>
        <div class="project-card__actions">
          <span class="project-card__size muted"></span>
          <button type="button" class="download-button" disabled>暂不可下载</button>
        </div>
      </div>
    </section>
  </template>
</section>
