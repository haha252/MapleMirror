<section class="download-page">
  <div id="download-status" class="status muted" hidden></div>
  <div id="project-cards" class="project-grid"></div>
  <template id="project-card-template">
    <section class="project-card panel-card">
      <div class="project-card__head">
        <div class="project-card__meta">
          <img class="project-card__icon" alt="">
          <div class="project-card__title">
            <h2><span class="project-name"></span><span class="version-badge"></span></h2>
            <p class="muted project-repository"></p>
          </div>
        </div>
        <div class="project-card__summary">
          <p class="muted project-updated"></p>
          <p class="project-availability"></p>
        </div>
      </div>
      <div class="project-card__body">
        <div class="field">
          <label>版本</label>
          <select class="version-select"></select>
        </div>
        <div class="field system-field" hidden>
          <label>系统</label>
          <select class="system-select"></select>
        </div>
        <div class="field architecture-field" hidden>
          <label>架构</label>
          <select class="architecture-select"></select>
        </div>
        <div class="project-card__actions">
          <span class="project-card__size muted"></span>
          <button type="button" class="download-button">下载</button>
        </div>
      </div>
    </section>
  </template>
  <script id="download-projects" type="application/json">{{.ProjectsJSON}}</script>
</section>
