<section class="download-pow-page">
  <div class="download-pow panel-card">
    <div class="download-pow__head">
      <h2 id="download-pow-title" hidden></h2>
      <p id="download-pow-meta" class="muted" hidden></p>
    </div>
    <div id="download-pow-status" class="status muted">正在准备挑战...</div>
    <div class="download-pow__support">
      <div class="download-pow__support-copy">
        <div class="download-pow__actions">
          <button type="button" id="download-pow-retry" class="button-link button-link--primary" hidden>重试</button>
          {{if .FromHome}}
          <a class="button-link button-link--primary" href="/">返回枫源镜像</a>
          {{else}}
          <a class="button-link" href="/">前往枫源镜像</a>
          <button type="button" class="button-link button-link--primary download-pow__back">返回来源页</button>
          {{end}}
        </div>
        <p>下载站费用高昂，如有能力，欢迎捐赠！</p>
      </div>
      <div class="download-pow__sponsors" aria-label="赞助二维码">
        <img src="{{staticURL "wechat.png"}}" alt="微信赞助二维码">
        <img src="{{staticURL "alipay.png"}}" alt="支付宝赞助二维码">
      </div>
    </div>
  </div>
  <script id="download-pow-asset" type="application/json">{{.AssetJSON}}</script>
</section>
