{{define "security"}}
<section class="security-overview">
  <article class="panel-card admin-panel security-summary-card">
    <div class="admin-panel__head"><div><h2>安全概览</h2><p class="muted">只突出需要处理的事项，正常状态不制造告警。</p></div><button id="security-refresh" class="admin-secondary" type="button">刷新</button></div>
    <div id="security-summary" class="security-summary">加载中...</div>
  </article>
  <article class="panel-card admin-panel">
    <div class="admin-panel__head"><h2>需要关注</h2></div>
    <div id="security-attention" class="admin-record-list"></div>
  </article>
</section>

<section class="panel-card admin-panel admin-extra">
  <div class="admin-panel__head"><div><h2>当前封禁</h2><p class="muted">默认显示原因、范围与到期时间；展开后查看升级和技术细节。</p></div><button id="blocks-delete-selected" class="admin-secondary" type="button">解除选中</button></div>
  <details class="security-create">
    <summary>添加手动封禁</summary>
    <div class="security-form">
      <label class="admin-field"><span>封禁类型</span><select id="block-kind" class="admin-select"><option value="client">公开下载客户端</option><option value="admin">管理登录来源</option></select></label>
      <label class="admin-field"><span>IP / 前缀</span><input id="block-key" type="text" placeholder="单个 IP；下载客户端也支持 IPv4 /24"></label>
      <label class="admin-field"><span>原因</span><input id="block-reason" type="text" placeholder="例如：持续异常请求"></label>
      <label class="admin-field security-duration"><span>时长</span><input id="block-duration" type="text" value="168h"></label>
      <div class="security-form-actions"><button id="block-create" class="admin-primary" type="button">确认添加</button></div>
    </div>
  </details>
  <div class="security-select-all"><label><input id="blocks-check-all" type="checkbox"> 选择本页全部</label><span class="muted">封禁后尝试次数最多延迟约 30 秒。</span></div>
  <div id="blocks-list" class="admin-record-list"></div>
  <div id="blocks-pager" class="admin-pager"></div>
</section>

<section class="panel-card admin-panel admin-extra">
  <div class="admin-panel__head"><div><h2>最近管理活动</h2><p class="muted">优先显示人类可读的操作与目标；ID 仅在详情中保留。</p></div></div>
  <div id="audit-list" class="admin-record-list"></div>
  <div id="audit-pager" class="admin-pager"></div>
</section>

<details class="panel-card admin-panel admin-extra security-advanced">
  <summary><strong>高级排障</strong><span class="muted">按授权 ID 查询流量记账事件</span></summary>
  <div class="security-advanced__body">
    <div class="traffic-filter">
      <input id="authorization-id" type="text" placeholder="授权 ID">
      <button id="authorization-query" class="admin-secondary" type="button">查询</button>
      <button id="authorization-clear" class="admin-secondary" type="button">查看最近事件</button>
      <span id="traffic-scope" class="muted">最近事件</span>
    </div>
    <div id="traffic-events" class="admin-table-wrap"></div>
    <div id="traffic-pager" class="admin-pager"></div>
  </div>
</details>
{{end}}
