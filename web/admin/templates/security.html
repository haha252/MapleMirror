{{define "security"}}
<section id="security-summary" class="ws-metrics" aria-label="安全汇总"></section>
<section class="ws-workspace">
  <section class="panel-card ws-panel ws-left">
    <div class="ws-head"><h2 id="security-list-title">当前封禁</h2><span id="security-updated" class="muted">最近更新 —</span></div>
    <section id="security-blocks" class="ws-mode ws-panel">
      <div class="ws-controls"><input id="blocks-search" type="search" placeholder="搜索 IP 或前缀" aria-label="搜索封禁"><button id="blocks-search-button" class="admin-secondary">搜索</button><button id="blocks-search-clear" class="admin-secondary">清空</button><button id="blocks-delete-selected" class="admin-secondary">解除选中</button></div>
      <div class="ws-controls"><label><input id="blocks-check-all" type="checkbox"> 选择本页</label><span id="blocks-search-scope" class="muted">全部活跃封禁</span><button id="block-create-open" class="admin-secondary">添加封禁</button></div>
      <div id="blocks-list" class="ws-scroll"></div><div id="blocks-pager" class="ws-pager"></div>
    </section>
    <section id="security-audit" class="ws-mode ws-panel" hidden><div class="ws-controls"><input id="audit-search" type="search" placeholder="筛选本页操作、目标和结果" aria-label="筛选本页审计记录"><span class="muted">最近管理活动</span></div><div id="audit-list" class="ws-scroll"></div><div id="audit-pager" class="ws-pager"></div></section>
    <section id="security-downloads" class="ws-mode ws-panel" hidden><div class="ws-controls"><input id="download-history-ip" type="text" placeholder="单个 IPv4 / IPv6" aria-label="查询 IP"><button id="download-history-query" class="admin-secondary">查询</button><button id="download-history-clear" class="admin-secondary">清空</button></div><div id="download-history-summary" class="ws-controls"></div><div id="download-history-list" class="ws-scroll"></div><div id="download-history-pager" class="ws-pager"></div></section>
  </section>
  {{template "workspace-detail" .}}
</section>
{{end}}
