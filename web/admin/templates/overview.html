{{define "overview"}}
<section class="ws-metrics" aria-label="运行汇总">
  <article class="panel-card ws-metric"><span>在线节点</span><strong id="metric-online">—</strong></article>
  <article class="panel-card ws-metric"><span>可下载节点</span><strong id="metric-download">—</strong></article>
  <article class="panel-card ws-metric"><span>镜像有效吞吐</span><strong id="metric-throughput">—</strong></article>
  <article class="panel-card ws-metric"><span>今日公网流量</span><strong id="metric-daily">—</strong></article>
  <article class="panel-card ws-metric"><span>待处理事项</span><strong id="metric-attention">—</strong></article>
</section>
<section class="ws-workspace ws-overview">
  <div class="ws-overview-stack ws-left">
    <section class="panel-card ws-panel ws-overview-nodes"><div class="ws-head"><h2>节点状态</h2><div class="ws-head-actions"><span id="overview-updated" class="muted">最近更新 —</span><a href="/admin/nodes">查看全部节点 →</a></div></div><div id="overview-nodes" class="ws-scroll"><div class="ws-empty">正在读取节点…</div></div></section>
    <section class="panel-card ws-panel"><div class="ws-head"><h2>同步概况</h2><a href="/admin/sync">进入同步 →</a></div><div id="overview-sync" class="ws-summary-grid ws-summary-grid--sync"></div></section>
  </div>
  {{template "workspace-detail" .}}
</section>
{{end}}
