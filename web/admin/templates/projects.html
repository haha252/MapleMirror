{{define "projects"}}
<section id="projects-metrics" class="ws-metrics" aria-label="项目汇总"></section>
<section class="ws-workspace">
  <section class="panel-card ws-panel ws-left"><div class="ws-head projects-list-head"><h2>项目列表</h2><div class="ws-head-actions"><span id="projects-updated" class="muted">最近更新 —</span><button id="scan-all" class="admin-secondary" type="button">触发全部扫描</button></div></div><div class="ws-controls"><input id="projects-search" type="search" placeholder="搜索项目、仓库或标签" aria-label="搜索项目"><select id="projects-filter" aria-label="筛选项目"><option value="all">全部项目</option><option value="enabled">已启用</option><option value="disabled">已停用</option><option value="failed">扫描失败</option></select><span id="projects-summary" class="muted">加载中</span></div><div id="project-grid" class="ws-scroll"></div></section>
  {{template "workspace-detail" .}}
</section>
{{end}}

{{define "project-edit"}}
<section class="ws-workspace ws-editor" id="workspace-editor">
  <nav class="panel-card ws-editor-nav" aria-label="项目配置分类"><a href="#editor-basic" aria-current="true">基本信息</a><a href="#editor-policy">运行与保留</a><a href="#editor-selectors">下载选择器</a><a href="#editor-architecture">架构识别</a><a href="#editor-system">系统识别</a><a href="#editor-include">包含规则</a><a href="#editor-exclude">排除规则</a></nav>
  <section class="panel-card ws-panel"><div id="project-editor" class="ws-scroll ws-detail-body project-editor-page"></div></section>
</section>
{{end}}
