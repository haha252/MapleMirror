# 主节点项目清单补齐模板
# 仅支持公开 GitHub 仓库，扫描时会校验可访问性及资产摘要。
# 拆分项目配置入口；留空表示只使用下方兼容的 projects 列表。
project_files: []

# 项目列表；每个项目对应一个公开 GitHub owner/repository 仓库。
projects:
  # 单个项目补齐模板；空值不会替代已有项目身份。
  -
    # 项目唯一 ID；用于 URL、数据库主键和公开路径，不得重复。
    id: ""
    # 下载页和管理面板展示的项目中文名称。
    name: ""
    # GitHub 仓库，必须使用 owner/repository 格式，不允许 URL。
    repository: ""
    # 项目图标相对当前 projects.yaml 所在目录；留空表示使用内置占位图标。
    icon_path: ""
    # 是否启用该项目；禁用后不会参与扫描和公共展示。
    enabled: false
    # 每个下载节点应保留的版本数量，默认值为 3。
    retain_versions: 3
    # 是否允许 GitHub prerelease 版本进入候选版本。
    include_prerelease: false
    # 倍率仅扣减请求额度，不放大实际流量统计或每日流量限额。
    download_multiplier: 1
    # 资产入选规则；空列表保持默认允许所有资产。
    asset_include:
      -
        # pattern 匹配资产文件名；type=regex 时使用 Go 正则。
        pattern: ""
        # type 可选 glob 或 regex；旧字符串写法按 glob 处理。
        type: glob
        # required=false 表示可选入选规则；required=true 表示必须命中。
        required: false
    # 排除规则优先于包含规则；空列表表示不额外排除。
    asset_exclude:
      -
        # pattern 匹配需要排除的资产文件名。
        pattern: ""
        # type 可选 glob 或 regex；regex 支持 (?i) 大小写不敏感。
        type: glob
        # required=false 命中即排除；required=true 参与组合排除。
        required: false
    # 可选：分类/指派规则。过滤仍由 asset_include 和 asset_exclude 决定。
    asset_pipeline:
      # 下载页的条件选择器独立于分类方式；留空时保持旧版自动推断行为。
      selectors:
        # 是否显示架构选择器；留空时按已有分类配置推断。
        architecture_enabled:
        # 是否显示系统选择器；留空时按已有分类配置推断。
        system_enabled:
      # classify.mode 为每个项目选择一种资产分类方式。
      # - regex：只使用 regex 子节点里的提取配置，rules 和 script 不参与分类。
      # - rules：只使用下方 rules/script，旧正则配置即使存在也不会执行。
      # - 留空：兼容旧配置，会先跑旧正则再跑 rules/script；新项目建议显式写 regex 或 rules。
      classify:
        # 分类模式；补齐时留空以保持旧配置的兼容行为。
        mode: ""
        # regex 模式专用配置；mode=rules 时不会执行。
        regex:
          # 启用后 architecture_regex 从已入选资产文件名提取展示架构。
          architecture_match_enabled: false
          # 仅在 architecture_match_enabled=true 时编译和使用。
          architecture_regex: "(?i)(amd64|arm64|x86_64)"
          # 启用后 system_regex 从文件名提取并规范化为 win/linux/darwin/harmony。
          system_match_enabled: false
          # 仅在 system_match_enabled=true 时编译和使用。
          system_regex: "(?i)(windows|win|linux|darwin|macos|osx|harmonyos|openharmony|ohos)"
        # rules 按顺序应用；后命中的赋值可以覆盖前面规则的赋值。
        rules: []
        # script 可选；用于通过 Starlark 脚本执行高级分类。
        script:
          # path 为相对当前项目配置文件的脚本路径。
          path: ""
          # inline 为内联脚本；通常建议使用 path 便于维护。
          inline: ""
