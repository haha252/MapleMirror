# 镜像服务下载节点配置示例
# 本文件使用 UTF-8 编码。M1 仅提供配置校验和基础健康服务。
node:
  name: "示例下载节点"
  id_file: "data/node-id"

server:
  listen: ":8081"

master:
  # 下载节点主动连接主节点控制面，M2 开始使用 mTLS。
  control_address: "https://127.0.0.1:9443"
  enrollment_address: "https://127.0.0.1:9444"

storage:
  directory: "data/assets"
  temp_directory: "data/tmp"
  # 节点状态库将持久化未被主节点确认的流量事件。
  state_db: "data/node-state.db"

bandwidth:
  target: "100 MiB/s"

sync:
  max_workers: 2
  bandwidth_limit: "0"

download_token:
  # 下载节点只保存主节点下载令牌 Ed25519 公钥，不保存签发私钥。
  verify_public_key_file: "data/download-token-ed25519.pub"

proxy:
  # 下载节点若位于反向代理后，仅信任这些直连代理 CIDR 提供的转发头。
  trusted_cidrs: []

logging:
  console_level: "info"
  file_level: "info"
  directory: "logs/node"
  retention_days: 30

pairing:
  credential_file: "data/node-credential.json"
  code_file: "data/pairing-code"

tls:
  # 配对后写入证书文件；私钥不得记录到日志。
  ca_file: "data/master-ca.pem"
  cert_file: "data/node.crt"
  key_file: "data/node.key"
  server_name: "127.0.0.1"
